<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聯繫我們 - 木育玩具設計</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="style.css" />

  <style>
    body { background-color: #fbf9f5; }
    .contact-card {
      background: #fff; border: 1px solid #e7e2d8; border-radius: 0.5rem;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease, border-color 0.3s ease;
    }
    .contact-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(45,73,32,0.12); border-color: rgba(94,139,58,0.35); }
    .map-frame { border: 1px solid #e7e2d8; border-radius: 0.5rem; overflow: hidden; }
  </style>
</head>
<body>

<div id="nav-container"></div>

<header class="page-hero text-center text-white">
  <div class="mt-12">
    <div class="text-caption tracking-[0.4em] text-stone-200 uppercase mb-3" data-en="Get in Touch">聯繫我們</div>
    <h1 class="text-h1 font-serif font-bold tracking-widest mb-4" data-en="Contact Us">聯繫我們</h1>
    <div class="text-caption tracking-[0.3em] text-stone-300 uppercase font-medium">WOODERFUL TOY DESIGN</div>
  </div>
</header>

<div class="max-w-7xl mx-auto px-6 lg:px-12 pt-8">
  <div class="flex items-center gap-2 text-body text-stone-400 font-medium">
    <a href="index.html" class="hover:text-forest-600"><i class="fa-solid fa-house-chimney text-caption"></i> <span data-en="Home">首頁</span></a> <span>&gt;</span>
    <span class="text-stone-600 font-semibold" data-en="Contact Us">聯繫我們</span>
  </div>
</div>

<main class="max-w-7xl mx-auto px-6 lg:px-12 py-12">

  <div class="text-center max-w-2xl mx-auto mb-16 reveal fade-up">
    <h2 class="text-h2 font-serif font-black text-wood-800 mb-4" data-en="We&#39;d Love to Hear From You">歡迎與我們聯繫</h2>
    <p class="text-body text-stone-600 leading-relaxed" data-en="Whether you have questions about our lesson plans, want to arrange a school workshop, or are interested in collaboration, feel free to reach out through any of the channels below.">無論是對教案內容有任何疑問、希望安排到校教學工作坊，或是有意合作交流，都歡迎透過以下方式與我們聯繫。</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-14 items-start mb-20">

    <div class="lg:col-span-5 space-y-6 reveal fade-right">

      <div class="contact-card p-7 flex gap-5 items-start">
        <div class="w-12 h-12 rounded-full border border-stone-300 bg-white flex items-center justify-center text-forest-600 shrink-0"><i class="fa-solid fa-building-columns text-sub"></i></div>
        <div>
          <h4 class="font-bold text-wood-800 text-h3 mb-1" data-en="Affiliation">任職學校</h4>
          <p class="text-stone-600 text-body font-semibold" data-en="National Taipei University of Education">國立臺北教育大學</p>
        </div>
      </div>

      <div class="contact-card p-7 flex gap-5 items-start">
        <div class="w-12 h-12 rounded-full border border-stone-300 bg-white flex items-center justify-center text-forest-600 shrink-0"><i class="fa-solid fa-phone text-sub"></i></div>
        <div>
          <h4 class="font-bold text-wood-800 text-h3 mb-1" data-en="Phone">聯絡電話</h4>
          <a href="tel:0966519157" class="text-stone-600 text-body font-semibold hover:text-forest-600">0966 519 157</a>
        </div>
      </div>

      <div class="contact-card p-7 flex gap-5 items-start">
        <div class="w-12 h-12 rounded-full border border-stone-300 bg-white flex items-center justify-center text-forest-600 shrink-0"><i class="fa-solid fa-envelope text-sub"></i></div>
        <div>
          <h4 class="font-bold text-wood-800 text-h3 mb-1" data-en="Email">電子郵件</h4>
          <a href="mailto:wtchang@mail.ntue.edu.tw" class="text-stone-600 text-body font-semibold hover:text-forest-600 break-all">wtchang@mail.ntue.edu.tw</a>
        </div>
      </div>

      <div class="contact-card p-7 flex gap-5 items-start">
        <div class="w-12 h-12 rounded-full border border-stone-300 bg-white flex items-center justify-center text-forest-600 shrink-0"><i class="fa-solid fa-clock text-sub"></i></div>
        <div>
          <h4 class="font-bold text-wood-800 text-h3 mb-1" data-en="Office Hours">聯繫時間</h4>
          <p class="text-stone-600 text-body font-semibold" data-en="Monday – Friday, 9:00 AM – 5:00 PM">週一至週五 09:00–17:00</p>
        </div>
      </div>

      <div class="contact-card p-7 flex gap-5 items-start">
        <div class="w-12 h-12 rounded-full border border-stone-300 bg-white flex items-center justify-center text-forest-600 shrink-0"><i class="fa-solid fa-share-nodes text-sub"></i></div>
        <div>
          <h4 class="font-bold text-wood-800 text-h3 mb-2" data-en="Follow Us">社群媒體</h4>
          <div class="flex gap-4">
            <a href="https://www.facebook.com/share/g/1EfHD5RXL1/" target="_blank" rel="noopener" aria-label="Facebook">
              <i class="fa-brands fa-facebook text-h3 text-stone-400 hover:text-forest-600 cursor-pointer transition-colors"></i>
            </a>
          </div>
        </div>
      </div>

    </div>

    <div class="lg:col-span-7 reveal fade-left">
      <div class="map-frame h-full min-h-[420px]">
        <iframe
          src="https://www.google.com/maps?q=%E5%9C%8B%E7%AB%8B%E8%87%BA%E5%8C%97%E6%95%99%E8%82%B2%E5%A4%A7%E5%AD%B8&output=embed"
          class="w-full h-full min-h-[420px]" style="border:0;" allowfullscreen loading="lazy"
          referrerpolicy="no-referrer-when-downgrade" title="國立臺北教育大學地圖">
        </iframe>
      </div>
    </div>

  </div>

  <div class="text-center max-w-md mx-auto reveal fade-up">
    <div class="w-12 h-12 bg-white border border-stone-200 rounded-full flex items-center justify-center text-forest-600 text-lg shadow-sm mx-auto mb-4">
      <i class="fa-solid fa-hands-holding-circle"></i>
    </div>
    <h4 class="text-h3 font-serif font-bold text-wood-800 mb-1" data-en="Interested in a School Workshop?">想安排到校教學工作坊？</h4>
    <p class="text-stone-400 text-caption mb-6" data-en="Send us an email and we&#39;ll get back to you shortly">來信與我們聯繫，我們將盡快回覆您</p>
    <a href="mailto:wtchang@mail.ntue.edu.tw" class="inline-block px-8 py-2 rounded-xl bg-forest-600 text-white font-semibold text-caption shadow-sm hover:bg-forest-700 transition-all" data-en="Email Us">寄送 Email</a>
  </div>

</main>

<div id="footer-container"></div>
<script src="layout.js"></script>
</body>
</html>
