                  - { label: "類別標題（英文，可留白）", name: "title_en", widget: "string", required: false }
                  - { label: "類別標題（日文，可留白）", name: "title_ja", widget: "string", required: false }
                  - { label: "類別標題（德文，可留白）", name: "title_de", widget: "string", required: false }
                  - label: "引用項目列表"
                    hint: "每項一則，這裡的英/日/德文會隨網站語言切換自動顯示；沒填的話該語言會顯示中文（或原文）。"
                    name: "items"
                    widget: "list"
                    label_singular: "一則引用"
                    summary: "{{fields.text}}"
                    fields:
                      - { label: "引用內容（原文，必填）", name: "text", widget: "text" }
                      - { label: "引用內容（英文，可留白）", hint: "不填的話，切換到英文版時會顯示原文。", name: "text_en", widget: "string", required: false }
                      - { label: "引用內容（日文，可留白）", name: "text_ja", widget: "string", required: false }
                      - { label: "引用內容（德文，可留白）", name: "text_de", widget: "string", required: false }

          - name: "thesis"
            label: "⑧ 研究生論文指導"
            widget: "object"
            fields:
              - name: "rows"
                label: "論文指導列表"
                widget: "list"
                label_singular: "一筆論文指導"
                summary: "{{fields.year}} - {{fields.title_zh}}"
                fields:
                  - { label: "論文題目（中文，必填）", name: "title_zh", widget: "string" }
                  - { label: "論文題目（英文，可留白）", name: "title_en", widget: "string", required: false }
                  - { label: "論文題目（日文，可留白）", name: "title_ja", widget: "string", required: false }
                  - { label: "論文題目（德文，可留白）", name: "title_de", widget: "string", required: false }
                  - { label: "研究生（中文，必填）", name: "student_zh", widget: "string" }
                  - { label: "研究生（英文，可留白）", name: "student_en", widget: "string", required: false }
                  - { label: "研究生（日文，可留白）", name: "student_ja", widget: "string", required: false }
                  - { label: "研究生（德文，可留白）", name: "student_de", widget: "string", required: false }
                  - { label: "畢業年", name: "year", widget: "string", required: false }

  - name: "lessons_extra"
    label: "分享教案（新增項目）"
    label_singular: "一份教案"
    files:
      - name: "lessons_extra"
        label: "教案列表"
        file: "data/lessons-extra.json"
        description: "在這裡新增全新的教案，有兩種上架方式：①「完整教案頁」——把下面的表單欄位（簡介／課程目標／材料／步驟等）逐一填寫，適合想呈現完整教學內容的教案；②「PNG 圖片頁」——不用逐欄填寫，直接把教案做成一張一張的截圖上傳（大多數教案只需要 1 張），適合想快速上架的教案。存檔後重新整理網站頁面就會看到，教案會出現在「分享教案」列表頁。"
        fields:
          - name: "items"
            label: "教案列表"
            widget: "list"
            label_singular: "一份教案"
            summary: "{{fields.title_zh}}"
            fields:
              - label: "網址代稱（必填）"
                hint: "英文/數字/連字號，例如 sailboat-race；同一份教案存檔後請勿更改，否則會變成新的網址。"
                name: "slug"
                widget: "string"
                pattern: ['^[a-z0-9-]+$', "只能用小寫英文字母、數字、連字號（-），不能有空格或中文"]
              - label: "教案呈現方式"
                hint: "PNG 圖片頁＝直接上傳教案截圖（目前主要新增方式，改用下面的「教案頁面圖片」欄位）；完整教案頁＝逐欄填寫下面的簡介／課程目標／材料／步驟等欄位。"
                name: "type"
                widget: "select"
                default: "images"
                required: false
                options:
                  - { label: "PNG 圖片頁", value: "images" }
                  - { label: "完整教案頁", value: "html" }
              - { label: "日期（用於排序）", hint: "選一天即可。", name: "sort_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
              - { label: "教案名稱（中文，必填）", name: "title_zh", widget: "string" }
              - { label: "教案名稱（英文，可留白）", name: "title_en", widget: "string", required: false }
              - { label: "教案名稱（日文，可留白）", name: "title_ja", widget: "string", required: false }
              - { label: "教案名稱（德文，可留白）", name: "title_de", widget: "string", required: false }
              - label: "封面照片"
                hint: "「分享教案」列表頁圓形縮圖專用，建議上傳一張方形、主體居中、畫面單純的照片，3MB 以內。不填的話會自動改用「照片」或「教案頁面圖片」的第一張，但那些通常不適合裁成圓形，容易顯示效果不佳。"
                name: "cover_image"
                widget: "image"
                required: false
              - { label: "一句話簡介（中文，可留白）", name: "summary_zh", widget: "text", required: false }
              - { label: "一句話簡介（英文，可留白）", name: "summary_en", widget: "text", required: false }
              - { label: "一句話簡介（日文，可留白）", name: "summary_ja", widget: "text", required: false }
              - { label: "一句話簡介（德文，可留白）", name: "summary_de", widget: "text", required: false }
              - { label: "適合年級", name: "grade", widget: "string", required: false }
              - { label: "教學時間", name: "duration", widget: "string", required: false }
              - { label: "參與人數", name: "group_size", widget: "string", required: false }
              - { label: "教學領域", name: "subject", widget: "string", required: false }
              - label: "照片"
                hint: "可新增多張，每張可加說明，建議 3MB 以內；可留白，第一張會當作列表縮圖。這是活動花絮照片，不是教案內容本身——PNG 圖片頁教案請改用下面的「教案頁面圖片」欄位。"
                name: "images"
                widget: "list"
                required: false
                default: []
                fields:
                  - { label: "圖片", name: "src", widget: "image" }
                  - { label: "圖片說明（可不填）", name: "caption", widget: "string", required: false }
              - label: "教案頁面圖片（中文／預設版本）"
                hint: "★ 目前主要的新增教案方式。依序上傳教案截圖，通常 1 張就夠，好幾頁可以多傳幾張，建議直式、單張 3MB 以內；第一張自動當作列表縮圖／封面。切換到英／日／德文時，若對應語言沒上傳圖片，會自動顯示這裡的中文版。"
                name: "page_images"
                widget: "list"
                required: false
                default: []
                fields:
                  - { label: "圖片", name: "src", widget: "image" }
                  - { label: "圖片說明（可不填）", hint: "僅供內部備註／無障礙替代文字，不會顯示在瀏覽頁上；可標註「第幾頁」方便之後編輯辨識，例如「p1」。", name: "caption", widget: "string", required: false }
              - label: "教案頁面圖片（英文版）"
                hint: "可留白；留白時網站切到英文會自動改顯示中文版圖片。建議直式、單張 3MB 以內。"
                name: "page_images_en"
                widget: "list"
                required: false
                default: []
                fields:
                  - { label: "圖片", name: "src", widget: "image" }
                  - { label: "圖片說明（可不填）", hint: "可標註「英文／第幾頁」方便之後編輯辨識，例如「en-p1」。", name: "caption", widget: "string", required: false }
              - label: "教案頁面圖片（日文版）"
                hint: "可留白；留白時網站切到日文會依序改顯示英文版、找不到再顯示中文版圖片。建議直式、單張 3MB 以內。"
                name: "page_images_ja"
                widget: "list"
                required: false
                default: []
                fields:
                  - { label: "圖片", name: "src", widget: "image" }
                  - { label: "圖片說明（可不填）", hint: "可標註「日文／第幾頁」方便之後編輯辨識，例如「ja-p1」。", name: "caption", widget: "string", required: false }
              - label: "教案頁面圖片（德文版）"
                hint: "可留白；留白時網站切到德文會依序改顯示英文版、找不到再顯示中文版圖片。建議直式、單張 3MB 以內。"
                name: "page_images_de"
                widget: "list"
                required: false
                default: []
                fields:
                  - { label: "圖片", name: "src", widget: "image" }
                  - { label: "圖片說明（可不填）", hint: "可標註「德文／第幾頁」方便之後編輯辨識，例如「de-p1」。", name: "caption", widget: "string", required: false }
              - label: "課程目標（中文，可留白）"
                hint: "以下（課程目標／材料清單／製作步驟）僅「教案呈現方式＝完整教案頁」時前台才會顯示，PNG 圖片頁教案可以略過不填。"
                name: "objectives_zh"
                widget: "text"
                required: false
              - { label: "課程目標（英文，可留白）", name: "objectives_en", widget: "text", required: false }
              - { label: "課程目標（日文，可留白）", name: "objectives_ja", widget: "text", required: false }
              - { label: "課程目標（德文，可留白）", name: "objectives_de", widget: "text", required: false }
              - label: "材料清單"
                hint: "每行一項，例如「木頭方塊 ×2」。僅「完整教案頁」使用。"
                name: "materials"
                widget: "list"
                required: false
                default: []
              - label: "製作步驟"
                hint: "每行一個步驟。僅「完整教案頁」使用。"
                name: "steps"
                widget: "list"
                required: false
                default: []
