            widget: "object"
            fields:
              - name: "categories"
                label: "類別列表"
                hint: "學術期刊論文／相關學報出版論文／發明專利／新型專利。（「國際學術研討會」已經獨立到下面單獨一區，不在這裡。）"
                widget: "list"
                label_singular: "一個類別"
                summary: "{{fields.title_zh}}"
                fields:
                  - { label: "類別標題（中文，必填）", hint: "例如：學術期刊論文（＊通訊作者）2007–2022", name: "title_zh", widget: "string" }
                  - { label: "類別標題（英文，可留白）", name: "title_en", widget: "string", required: false }
