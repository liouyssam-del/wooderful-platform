# Decap CMS 設定檔
# 這一版不需要任何「建置（build）」流程——教授在後台填表單存檔後，
# 資料直接寫進 data/updates-extra.json 等資料檔，網站用 JavaScript 在瀏覽器端讀取顯示，
# 重新整理頁面就會看到最新內容，Netlify 不需要跑 npm install 之類的步驟，風險比較低。
#
# 登入驗證改用 DecapBridge（因為 Netlify Identity 已經不開放新網站啟用）。

# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: liouyssam-del/wooderful-platform
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/e8d16737-cbd5-4640-986a-03e88974208e/pkce
  auth_token_endpoint: /sites/e8d16737-cbd5-4640-986a-03e88974208e/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# 教授上傳的圖片會存放到這個資料夾，並自動產生對應的網址
media_folder: "images/updates"
public_folder: "images/updates"

collections:
  - name: "updates_extra"
    label: "最新動態（新增項目）"
    label_singular: "一則動態"
    files:
      - name: "updates_extra"
        label: "最新動態列表"
        file: "data/updates-extra.json"
        description: "在這裡新增、刪除或修改「最新動態」頁面的內容。存檔後重新整理網站頁面就會看到，不需要等待任何建置流程。"
        fields:
          - name: "items"
            label: "動態列表"
            widget: "list"
            label_singular: "一則動態"
            summary: "{{fields.date_label}} - {{fields.title_zh}}"
            fields:
              - label: "分類"
                name: "category"
                widget: "select"
                required: false
                options:
                  - { label: "國際交流", value: "intl" }
                  - { label: "木育玩具開發與推廣", value: "wood" }
                  - { label: "竹育樂（2026~）", value: "bamboo" }
                  - { label: "產學合作計畫成果", value: "industry" }
              - { label: "日期（用於排序，選一天即可）", name: "sort_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
              - { label: "日期顯示文字（例如 2026 / 08）", name: "date_label", widget: "string", required: false }
              - { label: "標題（中文，必填）", name: "title_zh", widget: "string" }
              - { label: "標題（英文，可留白）", name: "title_en", widget: "string", required: false }
              - { label: "標題（日文，可留白）", name: "title_ja", widget: "string", required: false }
              - { label: "標題（德文，可留白）", name: "title_de", widget: "string", required: false }
              - { label: "內容（中文，可留白）", name: "desc_zh", widget: "text", required: false }
              - { label: "內容（英文，可留白）", name: "desc_en", widget: "text", required: false }
              - { label: "內容（日文，可留白）", name: "desc_ja", widget: "text", required: false }
              - { label: "內容（德文，可留白）", name: "desc_de", widget: "text", required: false }
              - label: "照片（可新增多張，每張可加說明；可留白）"
                name: "images"
                widget: "list"
                required: false
                default: []
                fields:
                  - { label: "圖片", name: "src", widget: "image" }
                  - { label: "圖片說明（可不填）", name: "caption", widget: "string", required: false }

  - name: "director_profile"
    label: "計畫主持人（頁面內容）"
    files:
      - name: "director_profile_all"
        label: "計畫主持人（頁面內容）"
        file: "data/director-profile.json"
        description: "「計畫主持人」頁面的所有分頁內容，整合在同一份表單裡編輯（往下捲動可以看到全部 9 個區塊：頁首職稱／榮譽／主要學歷／國際交流／研究計畫／教學暨設計實務經歷／研究發表／研究生論文指導／個人資歷）。存檔後重新整理「計畫主持人」頁面就會看到。"
        fields:
          - name: "header"
            label: "① 頁首職稱（照片右側的「單位」與「現職」兩行文字）"
            widget: "object"
            fields:
              - { label: "單位（中文，必填，例如：國立臺北教育大學｜藝術與造形設計學系（所））", name: "affiliation_zh", widget: "string" }
              - { label: "單位（英文，可留白）", name: "affiliation_en", widget: "string", required: false }
              - { label: "單位（日文，可留白）", name: "affiliation_ja", widget: "string", required: false }
              - { label: "單位（德文，可留白）", name: "affiliation_de", widget: "string", required: false }
              - { label: "現職（中文，必填，例如：現職：國立臺北教育大學藝術與造形設計學系 專任教授／教學發展中心 主任）", name: "position_zh", widget: "text" }
              - { label: "現職（英文，可留白）", name: "position_en", widget: "text", required: false }
              - { label: "現職（日文，可留白）", name: "position_ja", widget: "text", required: false }
              - { label: "現職（德文，可留白）", name: "position_de", widget: "text", required: false }

          - name: "honors"
            label: "② 榮譽"
            widget: "object"
            fields:
              - name: "items"
                label: "榮譽項目列表"
                widget: "list"
                label_singular: "一項榮譽"
                summary: "{{fields.text_zh}}"
                fields:
                  - { label: "內容（中文，必填）", name: "text_zh", widget: "text" }
                  - { label: "內容（英文，可留白）", name: "text_en", widget: "text", required: false }
                  - { label: "內容（日文，可留白）", name: "text_ja", widget: "text", required: false }
                  - { label: "內容（德文，可留白）", name: "text_de", widget: "text", required: false }

          - name: "education"
            label: "③ 主要學歷"
            widget: "object"
            fields:
              - name: "rows"
                label: "學歷列表"
                widget: "list"
                label_singular: "一筆學歷"
                summary: "{{fields.period}}"
                fields:
                  - { label: "期間（例如：2002/9–2009/1）", name: "period", widget: "string", required: false }
                  - name: "lines"
                    label: "內容（可分多行，例如學位一行、論文題目一行）"
                    widget: "list"
                    label_singular: "一行文字"
                    fields:
                      - { label: "內容（中文，必填）", name: "zh", widget: "text" }
                      - { label: "內容（英文，可留白）", name: "en", widget: "text", required: false }
                      - { label: "內容（日文，可留白）", name: "ja", widget: "text", required: false }
                      - { label: "內容（德文，可留白）", name: "de", widget: "text", required: false }
              - { label: "備註（中文，可留白，例如：近年主持專題研究計畫...）", name: "note_zh", widget: "text", required: false }
              - { label: "備註（英文，可留白）", name: "note_en", widget: "text", required: false }
              - { label: "備註（日文，可留白）", name: "note_ja", widget: "text", required: false }
              - { label: "備註（德文，可留白）", name: "note_de", widget: "text", required: false }

          - name: "exchange"
            label: "④ 國際交流"
            widget: "object"
            fields:
              - name: "items"
                label: "國際交流列表"
                widget: "list"
                label_singular: "一筆交流經歷"
                summary: "{{fields.period}}"
                fields:
                  - { label: "期間（例如：2024/6–2024/9）", name: "period", widget: "string", required: false }
                  - { label: "內容（中文，必填）", name: "desc_zh", widget: "text" }
                  - { label: "內容（英文，可留白）", name: "desc_en", widget: "text", required: false }
                  - { label: "內容（日文，可留白）", name: "desc_ja", widget: "text", required: false }
                  - { label: "內容（德文，可留白）", name: "desc_de", widget: "text", required: false }

          - name: "research_projects"
            label: "⑤ 研究計畫（國科會研究計畫 / 產學合作計畫）"
            widget: "object"
            fields:
              - name: "items"
                label: "計畫列表"
                widget: "list"
                label_singular: "一筆計畫"
                summary: "{{fields.year_roc}} - {{fields.title_zh}}"
                fields:
                  - label: "表格分類"
                    name: "table"
                    widget: "select"
                    required: false
                    options:
                      - { label: "國科會研究計畫", value: "nstc" }
                      - { label: "產學合作計畫", value: "industry" }
                  - { label: "民國年（例如 115 或 113-115）", name: "year_roc", widget: "string", required: false }
                  - { label: "學門（中文，可留白）", name: "field_zh", widget: "string", required: false }
                  - { label: "學門（英文，可留白）", name: "field_en", widget: "string", required: false }
                  - { label: "學門（日文，可留白）", name: "field_ja", widget: "string", required: false }
                  - { label: "學門（德文，可留白）", name: "field_de", widget: "string", required: false }
                  - { label: "計畫名稱（中文，必填）", name: "title_zh", widget: "string" }
                  - { label: "計畫名稱（英文，可留白）", name: "title_en", widget: "string", required: false }
                  - { label: "計畫名稱（日文，可留白）", name: "title_ja", widget: "string", required: false }
                  - { label: "計畫名稱（德文，可留白）", name: "title_de", widget: "string", required: false }
                  - { label: "起迄／狀態（中文，可留白，例如：已結案／1年型／民112-113）", name: "duration_zh", widget: "string", required: false }
                  - { label: "起迄／狀態（英文，可留白）", name: "duration_en", widget: "string", required: false }
                  - { label: "起迄／狀態（日文，可留白）", name: "duration_ja", widget: "string", required: false }
                  - { label: "起迄／狀態（德文，可留白）", name: "duration_de", widget: "string", required: false }

          - name: "teaching"
            label: "⑥ 教學暨設計實務經歷"
            widget: "object"
            fields:
              - name: "teaching"
                label: "【教學】列表"
                widget: "list"
                label_singular: "一筆教學經歷"
                summary: "{{fields.period}}"
                fields:
                  - { label: "期間（例如：2021/8–迄今）", name: "period", widget: "string", required: false }
                  - { label: "內容（中文，必填）", name: "desc_zh", widget: "text" }
                  - { label: "內容（英文，可留白）", name: "desc_en", widget: "text", required: false }
                  - { label: "內容（日文，可留白）", name: "desc_ja", widget: "text", required: false }
                  - { label: "內容（德文，可留白）", name: "desc_de", widget: "text", required: false }
              - name: "design"
                label: "【設計實務】列表"
                widget: "list"
                label_singular: "一筆設計實務經歷"
                summary: "{{fields.period}}"
                fields:
                  - { label: "期間（例如：1994/8–1997/8）", name: "period", widget: "string", required: false }
                  - { label: "內容（中文，必填）", name: "desc_zh", widget: "text" }
                  - { label: "內容（英文，可留白）", name: "desc_en", widget: "text", required: false }
                  - { label: "內容（日文，可留白）", name: "desc_ja", widget: "text", required: false }
                  - { label: "內容（德文，可留白）", name: "desc_de", widget: "text", required: false }

          - name: "publications"
            label: "⑦ 研究發表"
            widget: "object"
            fields:
              - name: "categories"
                label: "類別列表（學術期刊論文／相關學報出版論文／國際學術研討會／發明專利／新型專利）"
                widget: "list"
                label_singular: "一個類別"
                summary: "{{fields.title_zh}}"
                fields:
                  - { label: "類別標題（中文，必填，例如：學術期刊論文（＊通訊作者）2007–2022）", name: "title_zh", widget: "string" }
                  - { label: "類別標題（英文，可留白）", name: "title_en", widget: "string", required: false }
                  - { label: "類別標題（日文，可留白）", name: "title_ja", widget: "string", required: false }
                  - { label: "類別標題（德文，可留白）", name: "title_de", widget: "string", required: false }
                  - label: "引用項目列表（每項一則，維持單一語言，這些引用文字不隨網站語言切換）"
                    name: "items"
                    widget: "list"
                    label_singular: "一則引用"
                    field: { label: "引用內容", name: "text", widget: "text" }

          - name: "thesis"
            label: "⑧ 研究生論文指導"
            widget: "object"
            fields:
              - name: "rows"
                label: "論文指導列表"
                widget: "list"
                label_singular: "一筆論文指導"
                summary: "{{fields.year}} - {{fields.title_zh}}"
                fields:
                  - { label: "論文題目（中文，必填）", name: "title_zh", widget: "string" }
                  - { label: "論文題目（英文，可留白）", name: "title_en", widget: "string", required: false }
                  - { label: "論文題目（日文，可留白）", name: "title_ja", widget: "string", required: false }
                  - { label: "論文題目（德文，可留白）", name: "title_de", widget: "string", required: false }
                  - { label: "研究生（中文，必填）", name: "student_zh", widget: "string" }
                  - { label: "研究生（英文，可留白）", name: "student_en", widget: "string", required: false }
                  - { label: "研究生（日文，可留白）", name: "student_ja", widget: "string", required: false }
                  - { label: "研究生（德文，可留白）", name: "student_de", widget: "string", required: false }
                  - { label: "畢業年", name: "year", widget: "string", required: false }

          - name: "personal_resume"
            label: "⑨ 個人資歷"
            widget: "object"
            fields:
              - name: "items"
                label: "資歷項目列表（教授文字尚未提供前可留空，頁面會顯示「內容準備中」）"
                widget: "list"
                label_singular: "一項資歷"
                summary: "{{fields.text_zh}}"
                fields:
                  - { label: "內容（中文，必填）", name: "text_zh", widget: "text" }
                  - { label: "內容（英文，可留白）", name: "text_en", widget: "text", required: false }
                  - { label: "內容（日文，可留白）", name: "text_ja", widget: "text", required: false }
                  - { label: "內容（德文，可留白）", name: "text_de", widget: "text", required: false }

  - name: "lessons_extra"
    label: "分享教案（新增項目）"
    label_singular: "一份教案"
    files:
      - name: "lessons_extra"
        label: "教案列表"
        file: "data/lessons-extra.json"
        description: "在這裡新增全新的教案。存檔後重新整理網站頁面就會看到，教案會出現在「分享教案」列表頁，並產生一個獨立的教案內容頁。"
        fields:
          - name: "items"
            label: "教案列表"
            widget: "list"
            label_singular: "一份教案"
            summary: "{{fields.title_zh}}"
            fields:
              - label: "網址代稱（英文/數字/連字號，例如 sailboat-race，同一份教案存檔後請勿更改，否則會變成新的網址；必填）"
                name: "slug"
                widget: "string"
                pattern: ['^[a-z0-9-]+$', "只能用小寫英文字母、數字、連字號（-），不能有空格或中文"]
              - { label: "日期（用於排序，選一天即可）", name: "sort_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
              - { label: "教案名稱（中文，必填）", name: "title_zh", widget: "string" }
              - { label: "教案名稱（英文，可留白）", name: "title_en", widget: "string", required: false }
              - { label: "教案名稱（日文，可留白）", name: "title_ja", widget: "string", required: false }
              - { label: "教案名稱（德文，可留白）", name: "title_de", widget: "string", required: false }
              - { label: "一句話簡介（中文，可留白）", name: "summary_zh", widget: "text", required: false }
              - { label: "一句話簡介（英文，可留白）", name: "summary_en", widget: "text", required: false }
              - { label: "一句話簡介（日文，可留白）", name: "summary_ja", widget: "text", required: false }
              - { label: "一句話簡介（德文，可留白）", name: "summary_de", widget: "text", required: false }
              - { label: "適合年級", name: "grade", widget: "string", required: false }
              - { label: "教學時間", name: "duration", widget: "string", required: false }
              - { label: "參與人數", name: "group_size", widget: "string", required: false }
              - { label: "教學領域", name: "subject", widget: "string", required: false }
              - { label: "課程目標（中文，可留白）", name: "objectives_zh", widget: "text", required: false }
              - { label: "課程目標（英文，可留白）", name: "objectives_en", widget: "text", required: false }
              - { label: "課程目標（日文，可留白）", name: "objectives_ja", widget: "text", required: false }
              - { label: "課程目標（德文，可留白）", name: "objectives_de", widget: "text", required: false }
              - label: "照片（可新增多張，每張可加說明；可留白，第一張會當作列表縮圖）"
                name: "images"
                widget: "list"
                required: false
                default: []
                fields:
                  - { label: "圖片", name: "src", widget: "image" }
                  - { label: "圖片說明（可不填）", name: "caption", widget: "string", required: false }
              - label: "材料清單（每行一項，例如「木頭方塊 ×2」）"
                name: "materials"
                widget: "list"
                required: false
                default: []
              - label: "製作步驟（每行一個步驟）"
                name: "steps"
                widget: "list"
                required: false
                default: []
