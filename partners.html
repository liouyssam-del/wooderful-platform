  <style>
    body { background-color: #FDFBF7; }

      text-align: center; width: 15rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 1px 4px rgba(60,40,25,0.04); transition: all 0.3s ease;

    .partner-logo { transition: transform 0.4s ease; }
    .partner-card:hover .partner-logo { transform: scale(1.1); }
    .partner-logo { width: 7.5rem; height: 7.5rem; object-fit: contain; margin: 0 auto 1rem; }
    .partner-placeholder {
      width: 7.5rem; height: 7.5rem; margin: 0 auto 1rem; border-radius: 9999px; background: #f5efe6;
      display: flex; align-items: center; justify-content: center; color: #a57a4e; font-size: 1.75rem;
    }

    /* 簡單色塊背景 */
    .partner-section-bg {
      background: #f3efe4;
      border: 1px solid #e7e2d8;
    }
    /* 段落標題 */
