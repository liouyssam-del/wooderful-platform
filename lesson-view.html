<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">教案 - 木育玩具設計</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background-color: #fbf9f5; }
  </style>
</head>
<body>

<div id="nav-container"></div>

<header class="page-hero text-center text-white">
  <div class="mt-12">
    <div class="text-caption tracking-[0.4em] text-stone-200 uppercase mb-3" data-en="Lessons" data-ja="レッスン" data-de="Lektionen">分享教案</div>
    <h1 id="lesson-title-hero" class="text-h1 font-serif font-bold tracking-widest mb-4">載入中…</h1>
    <div class="text-caption tracking-[0.3em] text-stone-300 uppercase font-medium">TEACHING RESOURCES</div>
  </div>
</header>

<div class="max-w-7xl mx-auto px-6 lg:px-12 pt-8">
  <div class="flex items-center gap-2 text-body text-stone-400 font-medium">
    <a href="index.html" class="hover:text-forest-600"><i class="fa-solid fa-house-chimney text-caption"></i> <span data-en="Home" data-ja="ホーム" data-de="Startseite">首頁</span></a> <span>&gt;</span>
    <a href="lessons.html" class="hover:text-forest-600" data-en="Lessons" data-ja="レッスン" data-de="Lektionen">分享教案</a> <span>&gt;</span>
    <span id="lesson-title-breadcrumb" class="text-stone-600 font-semibold">載入中…</span>
  </div>
</div>

<main class="max-w-7xl mx-auto px-6 lg:px-12 py-12">

  <div id="lesson-loading" class="text-center text-stone-400 py-20">
    <i class="fa-solid fa-spinner fa-spin text-h2 mb-4"></i>
    <p>教案載入中…</p>
  </div>

  <div id="lesson-not-found" class="hidden text-center text-stone-400 py-20">
    <i class="fa-solid fa-circle-question text-h1 mb-4"></i>
    <p class="text-h3">找不到這份教案，網址可能有誤。</p>
    <a href="lessons.html" class="inline-block mt-6 px-6 py-2 rounded-full bg-forest-600 text-white font-semibold">回到教案列表</a>
  </div>

  <div id="lesson-content" class="hidden">

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-14 items-start mb-16">
      <div class="lg:col-span-6 space-y-6 reveal fade-right">
        <div><span class="text-caption font-bold tracking-wider bg-forest-600 text-white px-4 py-1.5 rounded-sm" data-en="STEAM Lesson Plan" data-ja="STEAM教案" data-de="STEAM-Lehrplan">STEAM 教案</span></div>
        <h2 id="lesson-title-main" class="text-h1 font-serif font-black text-wood-800 tracking-wide"></h2>
        <p id="lesson-summary" class="text-body text-stone-600 leading-relaxed text-justify font-light"></p>
      </div>
      <div class="lg:col-span-6 border border-stone-200 p-2 bg-white shadow-sm rounded-sm reveal fade-left product-photo-frame">
        <img id="lesson-hero-image" src="" alt="" class="w-full h-[450px] object-contain">
      </div>
    </div>

    <div class="relative flex items-center justify-center my-16">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-dashed border-stone-300/80"></div></div>
      <div class="relative bg-[#fbf9f5] px-4 text-stone-400 text-sub">🔔</div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-14 items-start">
      <div class="lg:col-span-4 space-y-7 bg-white/40 p-8 rounded-md border border-stone-200/40 lg:sticky lg:top-32">
        <div class="flex items-center gap-5">
          <div class="w-12 h-12 rounded-full border border-stone-300 bg-white flex items-center justify-center text-wood-600"><i class="fa-solid fa-graduation-cap text-sub"></i></div>
          <div><h4 class="font-bold text-wood-800 text-h3" data-en="Grade Level" data-ja="対象学年" data-de="Klassenstufe">適合年級</h4><p id="lesson-grade" class="text-stone-600 text-body font-semibold"></p></div>
        </div>
        <div class="flex items-center gap-5">
          <div class="w-12 h-12 rounded-full border border-stone-300 bg-white flex items-center justify-center text-wood-600"><i class="fa-solid fa-clock text-sub"></i></div>
          <div><h4 class="font-bold text-wood-800 text-h3" data-en="Duration" data-ja="授業時間" data-de="Dauer">教學時間</h4><p id="lesson-duration" class="text-stone-600 text-body font-semibold"></p></div>
        </div>
        <div class="flex items-center gap-5">
          <div class="w-12 h-12 rounded-full border border-stone-300 bg-white flex items-center justify-center text-wood-600"><i class="fa-solid fa-users text-sub"></i></div>
          <div><h4 class="font-bold text-wood-800 text-h3" data-en="Group Size" data-ja="参加人数" data-de="Gruppengr&ouml;&szlig;e">參與人數</h4><p id="lesson-groupsize" class="text-stone-600 text-body font-semibold"></p></div>
        </div>
        <div class="flex items-center gap-5">
          <div class="w-12 h-12 rounded-full border border-stone-300 bg-white flex items-center justify-center text-wood-600"><i class="fa-solid fa-compass text-sub"></i></div>
          <div><h4 class="font-bold text-wood-800 text-h3" data-en="Subject Areas" data-ja="教科領域" data-de="Fachbereiche">教學領域</h4><p id="lesson-subject" class="text-stone-600 text-body font-semibold"></p></div>
        </div>
      </div>

      <div class="lg:col-span-8 space-y-8 reveal fade-up">
        <div class="bg-white border border-stone-200/60 p-8 rounded-sm flex gap-6 items-start">
          <div class="w-14 h-14 rounded-full bg-[#f4f1ea] border border-stone-200 flex items-center justify-center text-forest-600 shrink-0"><i class="fa-solid fa-bullseye text-h3"></i></div>
          <div class="space-y-3">
            <h3 class="text-h3 font-serif font-bold text-wood-800" data-en="Objectives" data-ja="授業目標" data-de="Lernziele">課程目標</h3>
            <p id="lesson-objectives" class="text-body text-stone-600 leading-relaxed"></p>
          </div>
        </div>
        <div class="bg-white border border-stone-200/60 p-8 rounded-sm flex gap-6 items-start">
          <div class="w-14 h-14 rounded-full bg-[#f4f1ea] border border-stone-200 flex items-center justify-center text-forest-600 shrink-0"><i class="fa-solid fa-layer-group text-h3"></i></div>
          <div class="space-y-3">
            <h3 class="text-h3 font-serif font-bold text-wood-800" data-en="Materials" data-ja="教材" data-de="Materialien">課程材料</h3>
            <ul id="lesson-materials" class="text-body text-stone-600 leading-relaxed list-disc pl-5 space-y-1"></ul>
          </div>
        </div>
        <div class="bg-white border border-stone-200/60 p-8 rounded-sm flex gap-6 items-start">
          <div class="w-14 h-14 rounded-full bg-[#f4f1ea] border border-stone-200 flex items-center justify-center text-forest-600 shrink-0"><i class="fa-solid fa-shoe-prints text-h3"></i></div>
          <div class="space-y-3">
            <h3 class="text-h3 font-serif font-bold text-wood-800" data-en="Steps" data-ja="手順" data-de="Schritte">製作步驟</h3>
            <ol id="lesson-steps" class="text-body text-stone-600 leading-relaxed list-decimal pl-5 space-y-2"></ol>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-24 text-center border-t border-stone-200/60 pt-16 max-w-md mx-auto reveal fade-up">
      <a href="lessons.html" class="inline-block px-8 py-2 rounded-xl bg-forest-600 text-white font-semibold text-caption shadow-sm hover:bg-forest-700 transition-all" data-en="Back to All Lessons" data-ja="教案一覧に戻る" data-de="Zur&uuml;ck zur &Uuml;bersicht">回到教案列表</a>
    </div>

  </div>
</main>

<div id="footer-container"></div>
<script src="layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const loadingEl = document.getElementById('lesson-loading');
  const notFoundEl = document.getElementById('lesson-not-found');
  const contentEl = document.getElementById('lesson-content');

  if (!slug) {
    loadingEl.classList.add('hidden');
    notFoundEl.classList.remove('hidden');
    return;
  }

  fetch('data/lessons-extra.json', { cache: 'no-store' })
    .then((res) => (res.ok ? res.json() : { items: [] }))
    .then((data) => {
      const items = (data && Array.isArray(data.items)) ? data.items : [];
      const lesson = items.find((it) => it.slug === slug);
      loadingEl.classList.add('hidden');
      if (!lesson) {
        notFoundEl.classList.remove('hidden');
        return;
      }

      function setText(id, zh, en, ja, de) {
        const el = document.getElementById(id);
        el.textContent = zh || '';
        if (en) el.setAttribute('data-en', en); else el.setAttribute('data-en', zh || '');
        if (ja) el.setAttribute('data-ja', ja); else el.setAttribute('data-ja', zh || '');
        if (de) el.setAttribute('data-de', de); else el.setAttribute('data-de', zh || '');
      }

      document.getElementById('page-title').textContent = (lesson.title_zh || '') + ' - 木育玩具設計';
      setText('lesson-title-hero', lesson.title_zh, lesson.title_en, lesson.title_ja, lesson.title_de);
      setText('lesson-title-breadcrumb', lesson.title_zh, lesson.title_en, lesson.title_ja, lesson.title_de);
      setText('lesson-title-main', lesson.title_zh, lesson.title_en, lesson.title_ja, lesson.title_de);
      setText('lesson-summary', lesson.summary_zh, lesson.summary_en, lesson.summary_ja, lesson.summary_de);
      setText('lesson-objectives', lesson.objectives_zh, lesson.objectives_en, lesson.objectives_ja, lesson.objectives_de);
      document.getElementById('lesson-grade').textContent = lesson.grade || '';
      document.getElementById('lesson-duration').textContent = lesson.duration || '';
      document.getElementById('lesson-groupsize').textContent = lesson.group_size || '';
      document.getElementById('lesson-subject').textContent = lesson.subject || '';

      if (lesson.image) {
        document.getElementById('lesson-hero-image').src = lesson.image;
      } else {
        document.getElementById('lesson-hero-image').closest('.lg\\:col-span-6').classList.add('hidden');
      }

      const materialsList = document.getElementById('lesson-materials');
      (lesson.materials || []).forEach((m) => {
        const li = document.createElement('li');
        li.textContent = m;
        materialsList.appendChild(li);
      });

      const stepsList = document.getElementById('lesson-steps');
      (lesson.steps || []).forEach((s) => {
        const li = document.createElement('li');
        li.textContent = s;
        stepsList.appendChild(li);
      });

      contentEl.classList.remove('hidden');

      if (window.applyLanguage && window.getCurrentLang) {
        window.applyLanguage(window.getCurrentLang());
      }
    })
    .catch(() => {
      loadingEl.classList.add('hidden');
      notFoundEl.classList.remove('hidden');
    });
});
</script>
</body>
</html>
